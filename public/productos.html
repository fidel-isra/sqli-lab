<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Productos — SQLi Lab</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<nav>
  <a href="/" class="logo">🔓 SQLi Lab</a>
  <a href="/pagina/login">Login</a>
  <a href="/pagina/noticias">Noticias</a>
  <a href="/pagina/productos" class="active">Productos</a>
  <a href="/pagina/buscar">Buscar</a>
  <a href="/pagina/perfil">Perfil</a>
  <span class="badge-vuln">⚠ Entorno Vulnerable</span>
</nav>

<div class="container">
  <div class="page-header">
    <h1>🛍️ Productos</h1>
    <p>Vulnerabilidad: <strong style="color:#ff6b6b">Error-based SQL Injection</strong> — parámetro <code>categoria</code></p>
  </div>

  <div class="form-card" style="max-width:100%;margin:0 0 2rem;">
    <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem;">
      <label style="font-size:.85rem;color:var(--muted);align-self:center;">Categoría:</label>
      <input type="text" id="catInput" value="electronica" style="flex:1;min-width:200px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:.6rem 1rem;border-radius:8px;font-size:.95rem;font-family:inherit;outline:none;"/>
      <button onclick="cargar()" style="background:var(--accent);color:white;border:none;padding:.6rem 1.2rem;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit;">Filtrar</button>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button onclick="set('electronica')" class="chip" style="cursor:pointer;border:none;">electronica</button>
      <button onclick="set('muebles')" class="chip" style="cursor:pointer;border:none;">muebles</button>
      <button onclick="set('audio')" class="chip" style="cursor:pointer;border:none;">audio</button>
      <button onclick="set(`electronica' AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT version()))) --`)" class="chip" style="cursor:pointer;border:none;background:rgba(230,57,70,.15);color:var(--accent2);">Error: version()</button>
      <button onclick="set(`electronica' AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT password FROM usuarios WHERE username='admin'))) --`)" class="chip" style="cursor:pointer;border:none;background:rgba(230,57,70,.15);color:var(--accent2);">Error: extraer password</button>
    </div>
  </div>

  <div id="resultado"></div>
</div>

<script>
function set(val) {
  document.getElementById('catInput').value = val;
  cargar();
}

async function cargar() {
  const cat = document.getElementById('catInput').value;
  const res = await fetch('/productos?categoria=' + encodeURIComponent(cat));
  const data = await res.json();
  const div = document.getElementById('resultado');

  if (data.data && data.data.length > 0) {
    let rows = data.data.map(r => `
      <tr>
        <td>${r.id}</td>
        <td>${r.nombre}</td>
        <td>${r.descripcion ?? ''}</td>
        <td class="price">$${r.precio}</td>
        <td><span class="chip">${r.categoria}</span></td>
        <td>${r.stock}</td>
      </tr>`).join('');
    div.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Categoría</th><th>Stock</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="result-box" style="margin-top:1rem;">
        <div class="result-header">SQL ejecutado</div>
        <pre>${data.sql_ejecutado}</pre>
      </div>`;
  } else {
    div.innerHTML = `
      <div class="result-box error">
        <div class="result-header">${data.error ? 'Error MySQL (datos extraidos!)' : 'Sin resultados'}</div>
        <pre>${JSON.stringify(data, null, 2)}</pre>
      </div>`;
  }
}

cargar();
</script>
</body>
</html>
