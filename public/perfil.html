<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil — SQLi Lab</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<nav>
  <a href="/" class="logo">🔓 SQLi Lab</a>
  <a href="/pagina/login">Login</a>
  <a href="/pagina/noticias">Noticias</a>
  <a href="/pagina/productos">Productos</a>
  <a href="/pagina/buscar">Buscar</a>
  <a href="/pagina/perfil" class="active">Perfil</a>
  <span class="badge-vuln">⚠ Entorno Vulnerable</span>
</nav>

<div class="container">
  <div class="page-header">
    <h1>👤 Perfiles de Usuario</h1>
    <p>Vulnerabilidad: <strong style="color:#ff6b6b">Data Exposure + SQL Injection</strong> — parámetro <code>user</code></p>
  </div>

  <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.5rem;">
    <input type="text" id="userInput" value="admin" placeholder="Nombre de usuario" style="flex:1;min-width:200px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:.7rem 1rem;border-radius:8px;font-size:.95rem;font-family:inherit;outline:none;"/>
    <button onclick="cargar()" style="background:var(--accent);color:white;border:none;padding:.7rem 1.4rem;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit;">Ver Perfil</button>
  </div>

  <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem;">
    <span style="font-size:.8rem;color:var(--muted);align-self:center;">Payloads:</span>
    <button onclick="set('admin')" class="chip" style="cursor:pointer;border:none;">admin</button>
    <button onclick="set('juan')" class="chip" style="cursor:pointer;border:none;">juan</button>
    <button onclick="set(`' OR 1=1 --`)" class="chip" style="cursor:pointer;border:none;background:rgba(230,57,70,.1);color:var(--accent2);">OR 1=1 (todos)</button>
    <button onclick="set(`admin' UNION SELECT 1,username,password,email,rol FROM usuarios --`)" class="chip" style="cursor:pointer;border:none;background:rgba(230,57,70,.1);color:var(--accent2);">UNION: extraer usuarios</button>
  </div>

  <div id="resultado"></div>
</div>

<script>
function set(val) {
  document.getElementById('userInput').value = val;
  cargar();
}

async function cargar() {
  const user = document.getElementById('userInput').value;
  const res  = await fetch('/perfil?user=' + encodeURIComponent(user));
  const data = await res.json();
  const div  = document.getElementById('resultado');

  if (data.data && data.data.length > 0) {
    const perfiles = data.data.map(p => {
      const inicial = (p.nombre_completo || p.username || '?')[0].toUpperCase();
      return `
        <div class="profile-card">
          <div class="avatar">${inicial}</div>
          <div class="profile-info">
            <h2>${p.nombre_completo || p.username || 'Desconocido'}</h2>
            <span class="role ${p.rol === 'admin' ? 'admin' : ''}">${p.rol || 'user'}</span>
            <div class="info-grid">
              <div class="info-item"><label>Usuario</label><span>${p.username || '—'}</span></div>
              <div class="info-item"><label>Email</label><span>${p.email || '—'}</span></div>
              <div class="info-item"><label>Teléfono</label><span>${p.telefono || '—'}</span></div>
              <div class="info-item"><label>Dirección</label><span>${p.direccion || '—'}</span></div>
            </div>
            ${p.bio ? `<p style="margin-top:1rem;color:var(--muted);font-size:.875rem;">${p.bio}</p>` : ''}
            ${p.token_secreto ? `
              <div class="token-box">
                <label>Token Secreto (expuesto!)</label>
                <code>${p.token_secreto}</code>
              </div>` : ''}
          </div>
        </div>`;
    }).join('');

    div.innerHTML = `
      ${perfiles}
      <div class="result-box" style="margin-top:1rem;">
        <div class="result-header">SQL ejecutado</div>
        <pre>${data.sql_ejecutado}</pre>
      </div>`;
  } else {
    div.innerHTML = `
      <div class="result-box error">
        <div class="result-header">Error / Sin resultados</div>
        <pre>${JSON.stringify(data, null, 2)}</pre>
      </div>`;
  }
}

cargar();
</script>
</body>
</html>
